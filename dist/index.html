<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Assistant</title>
<script>
/* ha-fast-kiosk loader. Picks up the current version (a cheap no-cache check of version.txt), or the last one if HA is slow. */
(function () {
  var done = false, last = "";
  try { last = localStorage.getItem("fast-kiosk-v") || ""; } catch (e) {}
  function go(v) {
    if (done) return; done = true;
    try { localStorage.setItem("fast-kiosk-v", v); } catch (e) {}
    var c = document.createElement("link"); c.rel = "stylesheet"; c.href = "theme.css?v=" + v; document.head.appendChild(c);
    var s = document.createElement("script"); s.type = "module"; s.src = "boot.js?v=" + v; document.head.appendChild(s);
  }
  fetch("version.txt", { cache: "no-cache" }).then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) { go((t || "").trim() || last || "0"); }, function () { go(last || "0"); });
  setTimeout(function () { go(last || "0"); }, 3000);
})();
</script>
</head>
<body></body>
</html>
